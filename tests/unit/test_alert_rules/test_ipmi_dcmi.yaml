rule_files:
  - ../../../src/prometheus_alert_rules/ipmi_dcmi.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: ipmi_dcmi_command_success{instance="ubuntu-0"}
        values: '0x15'

      - series: ipmi_dcmi_command_success{instance="ubuntu-1"}
        values: '1x15'
      - series: ipmi_dcmi_power_cosumption_watts{instance="ubuntu-1"}
        values: '102x15'

      - series: ipmi_dcmi_power_consumption_percentage{instance="ubuntu-2"}
        values: '0.85x15'
      - series: ipmi_dcmi_power_consumption_percentage{instance="ubuntu-3"}
        values: '0.75x15'

    alert_rule_test:
      - eval_time: 10m
        alertname: IPMIDCMICommandFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: ubuntu-0
            exp_annotations:
              summary: Failed to run ipmi_dcmi. (instance ubuntu-0)
              description: |
                Failed to get system power statistics using ipmi_dcmi.
                  VALUE = 0
                  LABELS = map[__name__:ipmi_dcmi_command_success instance:ubuntu-0]

      - eval_time: 10m
        alertname: IPMIDCMIPowerConsumptionPercentageOutstanding
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: ubuntu-2
            exp_annotations:
              summary: IPMI DCMI power consumption percentage is high. (instance ubuntu-2)
              description: |
                IPMI DCMI power consumption percentage is high for over 5 minutes.
                  POWER_CONSUMPTION_PERCENTAGE = 0.85
                  LABELS = map[__name__:ipmi_dcmi_power_consumption_percentage instance:ubuntu-2]

  - interval: 1m
    input_series:
      # unit/0: DCMI available. No alert.
      - series: up{juju_model="test-model", juju_model_uuid="uuid-1", juju_application="hardware-observer", juju_unit="hardware-observer/0", instance="ubuntu-0"}
        values: '1x15'
      - series: ipmi_dcmi_command_success{juju_model="test-model", juju_model_uuid="uuid-1", juju_application="hardware-observer", juju_unit="hardware-observer/0", instance="ubuntu-0"}
        values: '1x15'

      # unit/1: DCMI unsupported by the BMC. Alert fires.
      - series: up{juju_model="test-model", juju_model_uuid="uuid-1", juju_application="hardware-observer", juju_unit="hardware-observer/1", instance="ubuntu-1"}
        values: '1x15'

      # unit/2: target unreachable. No alert, already covered by HostDown rule.
      - series: up{juju_model="test-model", juju_model_uuid="uuid-1", juju_application="hardware-observer", juju_unit="hardware-observer/2", instance="ubuntu-2"}
        values: '0x15'

    alert_rule_test:
      - eval_time: 4m
        alertname: IPMIDCMICommandSuccessMetricsMissing
        exp_alerts: []

      - eval_time: 10m
        alertname: IPMIDCMICommandSuccessMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              juju_model: test-model
              juju_model_uuid: uuid-1
              juju_application: hardware-observer
              juju_unit: hardware-observer/1
              instance: ubuntu-1
            exp_annotations:
              summary: IPMI DCMI command success metrics missing. (instance ubuntu-1)
              description: |
                The ipmi_dcmi_command_success metric has been missing for over 5 minutes.
                This may indicate IPMI DCMI command timeouts, or that IPMI tools/services are not installed or supported on this hardware.
                If this hardware does not support IPMI DCMI, silence this alert for this unit.
                  LABELS = map[instance:ubuntu-1 juju_application:hardware-observer juju_model:test-model juju_model_uuid:uuid-1 juju_unit:hardware-observer/1]
